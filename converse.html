<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coverse | Yangi avlod platformasi</title>

<meta name="description" content="Coverse — odamlar, g‘oyalar va ta’limni bir joyga jamlovchi zamonaviy platforma.">
<link rel="canonical" href="https://coverse.com/">
<meta property="og:title" content="Coverse | Yangi avlod platformasi">
<meta property="og:description" content="Coverse — odamlar, g‘oyalar va ta’limni bir joyga jamlovchi zamonaviy platforma.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1221">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080d18;
    color:#fff;
    transition:.25s;
}

button,
input,
select,
textarea{
    font:inherit;
}

textarea{
    width:100%;
    resize:vertical;
    min-height:110px;
    padding:14px;
    border-radius:12px;
    border:1px solid #2a3958;
    background:#0a1120;
    color:#fff;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    background:
        radial-gradient(circle at top, rgba(110,161,255,.25), transparent 30%),
        linear-gradient(135deg, #07141f 0%, #0d1d32 46%, #050a11 100%);
}

.login-box{
    width:430px;
    max-width:100%;
    padding:34px 28px 28px;
    background:rgba(15,25,40,.88);
    border:1px solid rgba(147,173,255,.18);
    border-radius:26px;
    box-shadow:0 26px 80px rgba(0,0,0,.48);
    backdrop-filter:blur(6px);
}

.logo{
    text-align:center;
    color:#8fb1ff;
    font-size:40px;
    font-weight:900;
    letter-spacing:0.08em;
    margin-bottom:8px;
}

.login-sub{
    text-align:center;
    color:#b9c7e0;
    margin-bottom:28px;
    font-size:15px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;

    font-size:14px;

    color:#aebbd0;

    margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
    width:100%;

    padding:14px;

    outline:none;

    border-radius:12px;

    border:1px solid #2a3958;

    background:#0a1120;

    color:#fff;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#638fff;
}

.login-btn{
    width:100%;

    border:0;

    padding:14px;

    border-radius:12px;

    background:#527dff;

    color:#fff;

    font-weight:800;

    margin-top:5px;
}

.public-entry-box{
    margin-top:22px;

    background:rgba(17,24,39,.8);

    border:1px solid #2b3a58;

    border-radius:18px;

    padding:18px;
}

.public-entry-title{
    font-size:15px;

    font-weight:800;

    color:#dfe8ff;

    margin-bottom:10px;
}

.public-entry-item{
    padding:12px 14px;

    border-radius:10px;

    background:#101b2f;

    border:1px solid #243456;

    color:#e7ebf4;

    margin-top:10px;
}

.public-entry-item small{
    display:block;

    color:#94a3b8;

    margin-top:4px;
}

.empty-entry{
    margin-top:10px;

    padding:12px;

    border:1px dashed #3a4d71;

    border-radius:10px;

    color:#94a3b8;

    background:rgba(15,23,42,.25);
}

.secondary-btn{
    background:#2c3d66;
}

.login-error{
    display:none;

    background:#491f29;

    border:1px solid #783746;

    color:#ffb7c0;

    padding:12px;

    border-radius:10px;

    margin-bottom:15px;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    height:72px;

    position:sticky;
    top:0;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    background:#0f1728;

    border-bottom:1px solid #243149;
}

.brand{
    color:#6f9cff;

    font-size:26px;

    font-weight:900;
}

.top-actions{
    display:flex;

    gap:9px;
    align-items:center;
}

.device-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:92px;
    padding:8px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    letter-spacing:0.04em;
    background:#172b4a;
    border:1px solid #2e4370;
    color:#b7d0ff;
    text-transform:uppercase;
}

.top-btn{
    border:1px solid #2b3957;

    background:#151f34;

    color:#fff;

    padding:10px 13px;

    border-radius:10px;
}

/* =========================
   LAYOUT
========================= */

.main-layout{
    min-height:calc(100vh - 72px);

    display:flex;
}

.sidebar{
    width:238px;

    flex-shrink:0;

    background:#0b1322;

    border-right:1px solid #202d45;

    padding:22px 12px;
}

.nav-btn{
    width:100%;

    display:flex;
    align-items:center;
    gap:12px;

    border:1px solid transparent;

    background:transparent;

    color:#aab6ca;

    text-align:left;

    min-height:44px;

    padding:10px 14px;

    border-radius:8px;

    margin-bottom:4px;

    font-size:14px;

    transition:.18s ease;
}

.nav-btn:hover,
.nav-btn.active{
    background:#172b4a;

    border-color:#2c4d7e;

    color:#fff;
}

.nav-btn.active{
    position:relative;
    font-weight:700;
}

.nav-btn.active::before{
    content:"";

    position:absolute;
    left:-12px;
    top:7px;
    bottom:7px;

    width:3px;

    border-radius:0 3px 3px 0;
    background:#5d8cff;
}

.nav-icon{
    width:22px;

    flex-shrink:0;

    color:#8da7d2;
    font-size:17px;
    text-align:center;
}

.nav-btn.active .nav-icon,
.nav-btn:hover .nav-icon{
    color:#81a8ff;
}

.content{
    flex:1;

    padding:25px;

    min-width:0;
}

/* =========================
   TITLES
========================= */

.page-title{
    font-size:30px;

    font-weight:900;

    margin-bottom:8px;
}

.page-sub{
    color:#8d9bb2;

    margin-bottom:25px;
}

/* =========================
   CARDS
========================= */

.cards{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    margin-bottom:25px;
}

.card{
    background:linear-gradient(180deg, rgba(17,26,44,.96), rgba(10,15,25,.96));

    border:1px solid #2b3d61;

    border-radius:16px;

    padding:20px;

    box-shadow:0 14px 32px rgba(10,14,22,.28);
}

.card-title{
    color:#8e9cb5;

    font-size:14px;

    margin-bottom:10px;
}

.card-value{
    font-size:28px;

    font-weight:900;
}

.card-icon{
    font-size:26px;

    margin-bottom:10px;
}

/* =========================
   PANEL
========================= */

.panel{
    background:linear-gradient(180deg, rgba(17,26,44,.96), rgba(12,18,30,.96));

    border:1px solid #2a3c5d;

    border-radius:16px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:0 12px 30px rgba(9,14,23,.24);
}

.panel-head{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:17px;
}

.panel-title{
    font-size:19px;

    font-weight:800;
}

.primary{
    border:0;

    background:#527dff;

    color:#fff;

    padding:11px 16px;

    border-radius:10px;

    font-weight:700;
}

.danger{
    border:0;

    background:#d34854;

    color:#fff;

    padding:9px 13px;

    border-radius:9px;
}

.secondary{
    border:0;

    background:#31415f;

    color:#fff;

    padding:9px 13px;

    border-radius:9px;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    width:100%;

    overflow:auto;
}

table{
    width:100%;

    border-collapse:collapse;
}

th,
td{
    padding:13px 10px;

    text-align:left;

    border-bottom:1px solid #22304a;

    white-space:nowrap;
}

th{
    color:#8d9bb2;

    font-size:13px;
}

td{
    color:#dae2ef;
}

.empty{
    text-align:center;

    color:#7d8aa1;

    padding:25px;
}

/* =========================
   FORMS
========================= */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:14px;
}

.form-actions{
    grid-column:1/-1;
}

.full{
    grid-column:1/-1;
}

/* =========================
   BADGES
========================= */

.badge{
    display:inline-block;

    padding:5px 9px;

    background:#1b2a47;

    border:1px solid #2e4370;

    border-radius:20px;

    color:#9dbaff;

    font-size:12px;
}

.coin{
    color:#ffd75b;

    font-weight:900;
}

.status-present{
    color:#69e39a;
}

.status-absent{
    color:#ff7d89;
}

.status-late{
    color:#ffd15e;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:rgba(0,0,0,.73);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:620px;

    max-width:100%;

    background:#131d31;

    border:1px solid #344867;

    border-radius:20px;

    padding:25px;
}

.modal-title{
    font-size:23px;

    font-weight:900;

    margin-bottom:20px;
}

.credentials{
    background:#0a1120;

    border:1px solid #2a3b5b;

    border-radius:13px;

    padding:15px;
}

.credential-row{
    display:flex;

    justify-content:space-between;

    gap:15px;

    padding:10px 0;

    border-bottom:1px solid #202e48;
}

.credential-row:last-child{
    border-bottom:0;
}

.credential-label{
    color:#8796ae;
}

.modal-actions{
    margin-top:18px;

    display:flex;

    justify-content:flex-end;
}

/* O‘quvchilar sahifasida qo‘shish formasi belgi orqali ochiladi. */
.student-create-panel{
    display:none;
}

.student-create-panel.is-open{
    display:block;

    position:fixed;

    inset:20px;

    z-index:1001;

    overflow:auto;

    margin:0;

    box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.student-add-icon{
    width:42px;
    height:42px;

    float:right;
    margin-top:-50px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    border:1px solid #3d5da0;
    border-radius:11px;

    background:#527dff;
    color:#fff;

    font-size:28px;
    line-height:1;
}

.student-add-icon:hover{
    background:#638cff;
}

.student-create-close{
    border:0;

    background:transparent;
    color:#aebbd0;

    font-size:27px;
    line-height:1;
}

.student-create-close:hover{
    color:#fff;
}

/* =========================
   STUDENT DASHBOARD
========================= */

.student-hero{
    display:grid;

    grid-template-columns:
        1.2fr .8fr;

    gap:18px;

    margin-bottom:20px;
}

.profile-box{
    display:flex;

    align-items:center;

    gap:18px;
}

.avatar{
    width:75px;
    height:75px;

    flex-shrink:0;

    border-radius:50%;

    background:#243b67;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:30px;

    font-weight:900;
}

.coin-box{
    display:flex;

    flex-direction:column;

    justify-content:center;
}

.coin-value{
    font-size:35px;

    font-weight:900;

    color:#ffd65a;
}

.achievement{
    display:flex;

    align-items:center;

    gap:12px;

    padding:13px;

    margin-top:10px;

    background:#0c1424;

    border:1px solid #24334e;

    border-radius:12px;
}

.achievement-icon{
    font-size:27px;
}

/* =========================
   LIGHT MODE
========================= */

body.light{
    background:#edf2f8;

    color:#182033;
}

body.light .topbar,
body.light .sidebar{
    background:#fff;

    color:#182033;
}

body.light .panel,
body.light .card{
    background:#fff;

    border-color:#d5deea;
}

body.light .nav-btn{
    color:#56647b;
}

body.light .nav-btn.active,
body.light .nav-btn:hover{
    background:#edf3ff;

    border-color:#cbd9f3;

    color:#17213a;
}

body.light .page-sub,
body.light .card-title,
body.light th{
    color:#697890;
}

body.light td{
    color:#29364d;
}

body.light .top-btn{
    background:#f2f5fa;

    color:#182033;

    border-color:#d1d9e5;
}

body.light .field input,
body.light .field select{
    background:#fff;

    color:#182033;

    border-color:#ced7e5;
}

body.light .modal-box{
    background:#fff;

    color:#182033;
}

body.light .credentials{
    background:#f5f8fc;

    border-color:#d5deeb;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1200px){

    .cards{
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .student-hero{
        grid-template-columns:1fr;
    }

}

@media(max-width:900px){

    .main-layout{
        display:block;
    }

    .sidebar{
        width:100%;

        display:flex;
        flex-wrap:nowrap;
        overflow:auto;

        gap:7px;

        border-right:0;

        border-bottom:1px solid #202d45;
        padding:12px 10px;
    }

    .nav-btn{
        width:auto;

        min-width:max-content;

        margin:0;
    }

    .content{
        padding:18px 16px 22px;
    }

    .panel-head{
        flex-direction:column;
        align-items:flex-start;
    }

    .topbar{
        height:auto;
        min-height:72px;
        padding:12px 16px;
        gap:12px;
        flex-wrap:wrap;
    }

    .top-actions{
        margin-left:auto;
    }

}

@media(max-width:650px){

    body{
        min-width:320px;
    }

    .content{
        padding:14px 12px 18px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .form-actions{
        grid-column:auto;
    }

    .cards{
        grid-template-columns:
            1fr;
    }

    .topbar{
        padding:10px 12px;
    }

    .brand{
        font-size:21px;
    }

    .top-actions{
        width:100%;
        justify-content:flex-end;
    }

    .top-btn{
        flex:1;
        min-width:0;
    }

    .login-box{
        padding:25px 20px;
    }

    .page-title{
        font-size:24px;
    }

    .login-sub{
        font-size:14px;
    }

    .modal-box{
        padding:18px 16px;
    }

    .modal-actions{
        justify-content:stretch;
    }

    .modal-actions .secondary{
        width:100%;
    }

    .table-wrap{
        overflow-x:auto;
    }

    table{
        min-width:620px;
    }

    .sidebar{
        display:grid;
        grid-template-columns:repeat(2, minmax(0, 1fr));
    }

    .nav-btn{
        width:100%;
        min-width:0;
    }

    .profile-box{
        align-items:flex-start;
    }

    .avatar{
        width:58px;
        height:58px;
        font-size:24px;
    }

    .coin-value{
        font-size:28px;
    }

}

</style>
</head>

================================================== -->

    </div>

</div>

<script>

/* ==================================================
   STORAGE
================================================== */

const SAVE_KEY =
    "coverse_complete_v50";

const THEME_KEY =
    "coverse_theme_v50";

const AUTOSAVE_INTERVAL_MS =
    2 * 60 * 1000;

const REMOTE_SAVE_DEBOUNCE_MS = 350;

const IS_STATIC_SITE =
    window.location.hostname.endsWith("github.io");

let remoteSaveTimer = null;

async function apiRequest(path, options = {}){

    if(IS_STATIC_SITE){

        const body = options.body
            ? JSON.parse(options.body)
            : null;

        if(path === "/api/login"){

            const response = await fetch("coverse_data.json");
            const data = await response.json();
            const user = data.users.find(item =>
                String(item.phone).trim() === String(body.phone).trim() &&
                String(item.username).trim().toLowerCase() === body.username &&
                String(item.password) === body.password
            );

            return user
                ? {ok: true, user}
                : {ok: false};

        }

        if(path === "/api/public-data" || path === "/api/data"){

            const saved = localStorage.getItem(SAVE_KEY);
            const data = saved
                ? JSON.parse(saved)
                : await (await fetch("coverse_data.json")).json();

            return {ok: true, data};

        }

        if(path === "/api/save"){
            localStorage.setItem(SAVE_KEY, options.body);
            return {ok: true};
        }

        return {ok: true};
    }

    try{

        const response =
            await fetch(path, options);

        if(!response.ok){
            return null;
        }

        return await response.json();

    }catch{
        return null;
    }

}

async function readRemoteData(){

    const payload =
        await apiRequest("/api/data");

    if(!payload || !payload.ok || !payload.data){
        return null;
    }

    return payload.data;

}

async function readPublicData(){

    const payload =
        await apiRequest("/api/public-data");

    if(!payload || !payload.ok || !payload.data){
        return null;
    }

    return payload.data;

}

async function writeRemoteData(data){

    const payload =
        await apiRequest("/api/save", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(data)
        });

    return payload;

}

/* ==================================================
   MAIN TEACHER
================================================== */

const MAIN_TEACHER = {

    id:1,

    role:"teacher",

    isMain:true,

    isAdmin:true,

    hiddenFromList:true,

    full_name:"Bosh admin",

    phone:"",

    username:"owner",

    password:"",

    coins:0

};

/* ==================================================
   DATA
================================================== */

let users = [];

let groups = [];

let subjects = [];

let grades = [];

let attendance = [];

let notices = [];

let publicEntries = [];

let currentUser = null;

let currentPage = "dashboard";

let aiChatHistory = [];

function getAiChatHistory(){

    try{

        const saved = localStorage.getItem("coverse_ai_chat");

        if(!saved){
            return [];
        }

        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : [];

    }catch{
        return [];
    }

}

function saveAiChatHistory(){

    localStorage.setItem(
        "coverse_ai_chat",
        JSON.stringify(aiChatHistory)
    );

}

async function getAiReply(message){

    const trimmed = String(message || "").trim();

    if(!trimmed){
        return "Savolni yozing.";
    }

    const apiKey = localStorage.getItem("coverse_ai_api_key");

    if(apiKey){

        try{

            const response = await fetch(
                "https://openrouter.ai/api/v1/chat/completions",
                {
                    method:"POST",
                    headers:{
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        model:"openai/gpt-4o-mini",
                        messages:[
                            {
                                role:"system",
                                content:"You are a helpful Uzbek assistant for an education management system. Reply in Uzbek unless the user asks otherwise. Keep answers short, clear, and practical."
                            },
                            {
                                role:"user",
                                content:trimmed
                            }
                        ]
                    })
                }
            );

            if(response.ok){

                const payload = await response.json();

                const answer = payload?.choices?.[0]?.message?.content;

                if(answer && answer.trim()){
                    return answer.trim();
                }

            }

        }catch{
            // Fallback to local assistant if API is unavailable.
        }

    }

    const normalized = trimmed.toLowerCase();

    if(normalized.includes("salom") || normalized.includes("hello")){
        return "Salom! Men sizga platforma bo‘yicha yordam bera olaman. Qanday yordam kerak?";
    }

    if(normalized.includes("davomat") || normalized.includes("attendance")){
        return "Davomat bo‘limi orqali o‘quvchilar kelgan-kelmagan holatini ko‘rishingiz va yozishingiz mumkin.";
    }

    if(normalized.includes("baho") || normalized.includes("grade") || normalized.includes("ball")){
        return "Baholar bo‘limidan fanlar bo‘yicha baho qo‘shish, ko‘rish va tahlil qilish mumkin.";
    }

    if(normalized.includes("guruh") || normalized.includes("group")){
        return "Guruhlar bo‘limi orqali guruhlar yaratiladi va o‘quvchilar beriladi.";
    }

    if(normalized.includes("coin") || normalized.includes("coin berish")){
        return "Coin berish bo‘limi orqali foydalanuvchilarga rag‘batlantirish uchun coin yuborishingiz mumkin.";
    }

    if(normalized.includes("admin") || normalized.includes("bosh admin")){
        return "Bosh admin tizimni boshqaradi, foydalanuvchilarni yaratadi va parollarni nazorat qiladi.";
    }

    if(normalized.includes("qanday") || normalized.includes("yordam") || normalized.includes("help")){
        return "Men bu platformada guruh, davomat, baho, coin va foydalanuvchilarni boshqarishda yordam beraman. Sizga nima kerak?";
    }

    return `Men tushundim: "${trimmed}". Bu platformada eng tezkor yechim uchun guruhlar, davomat, baholar yoki foydalanuvchilar bo‘limini tekshirishni maslahat beraman.`;

}

================================================== */

async function loadData(){

    const saved = currentUser
        ? localStorage.getItem(SAVE_KEY)
        : null;

    if(saved){

        try{

            const data =
                JSON.parse(saved);

            users =
                Array.isArray(data.users)
                ? data.users
                : [];

            groups =
                Array.isArray(data.groups)
                ? data.groups
                : [];

            subjects =
                Array.isArray(data.subjects)
                ? data.subjects
                : [];

            grades =
                Array.isArray(data.grades)
                ? data.grades
                : [];

            attendance =
                Array.isArray(data.attendance)
                ? data.attendance
                : [];

            notices =
                Array.isArray(data.notices)
                ? data.notices
                : [];

            publicEntries =
                Array.isArray(data.publicEntries)
                ? data.publicEntries
                : [];

        }catch{

            users = [];
            groups = [];
            subjects = [];
            grades = [];
            attendance = [];
            notices = [];
            publicEntries = [];

        }

    }

    const remoteData =
        currentUser
        ? await readRemoteData()
        : await readPublicData();

    if(remoteData){

        if(currentUser){
            users =
                Array.isArray(remoteData.users)
                ? remoteData.users
                : users;
        }

        if(currentUser){
            groups =
                Array.isArray(remoteData.groups)
                ? remoteData.groups
                : groups;
        }

        if(currentUser){
            subjects =
                Array.isArray(remoteData.subjects)
                ? remoteData.subjects
                : subjects;
        }

        if(currentUser){
            grades =
                Array.isArray(remoteData.grades)
                ? remoteData.grades
                : grades;
        }

        if(currentUser){
            attendance =
                Array.isArray(remoteData.attendance)
                ? remoteData.attendance
                : attendance;
        }

        if(currentUser){
            notices =
                Array.isArray(remoteData.notices)
                ? remoteData.notices
                : notices;
        }

        publicEntries =
            Array.isArray(remoteData.publicEntries)
            ? remoteData.publicEntries
            : publicEntries;

        if(currentUser){
            localStorage.setItem(
                SAVE_KEY,
                JSON.stringify({
                    users,
                    groups,
                    subjects,
                    grades,
                    attendance,
                    notices,
                    publicEntries
                })
            );
        }

    }

    renderPublicEntries();

    aiChatHistory = getAiChatHistory();

    ensureMainTeacher();
}

/* ==================================================
   SAVE
================================================== */

function saveData(){

    const data = {

        users,

        groups,

        subjects,

        grades,

        attendance,

        notices,

        publicEntries

    };

    localStorage.setItem(

        SAVE_KEY,

        JSON.stringify(data)

    );

    if(remoteSaveTimer){
        clearTimeout(remoteSaveTimer);
    }

    remoteSaveTimer = setTimeout(() => {
        writeRemoteData(data);
        remoteSaveTimer = null;
    }, REMOTE_SAVE_DEBOUNCE_MS);

}

function startAutosave(){

    setInterval(() => {
        saveData();
    }, AUTOSAVE_INTERVAL_MS);

    window.addEventListener(
        "beforeunload",
        () => {
            saveData();
            if(remoteSaveTimer){
                clearTimeout(remoteSaveTimer);
                writeRemoteData({
                    users,
                    groups,
                    subjects,
                    grades,
                    attendance,
                    notices,
                    publicEntries
                });
            }
        }
    );

}

/* ==================================================
   ENSURE MAIN TEACHER
================================================== */

function ensureMainTeacher(){

    let main =
        users.find(
            u => u.isMain === true
        );

    if(!main){

        main = {
            ...MAIN_TEACHER
        };

        users.push(main);

    }else{

        main.id = 1;

        main.role = "teacher";

        main.isMain = true;

        main.isAdmin = true;

        main.hiddenFromList = true;

        main.full_name ||= "Bosh admin";

        main.phone ||= "";

        main.username ||= "owner";

        main.password ||= "";

    }

    users.forEach(user => {

        if(
            typeof user.coins !== "number"
        ){

            user.coins = 0;

        }

    });

    saveData();
}

function students(){

    return users.filter(
        user => user.role === "student"
    );

}

function regularTeachers(){

    return users.filter(
        user =>
            user.role === "teacher" &&
            user.isMain !== true
    );

}

function secondaryAdminUsers(){

    return users.filter(
        user =>
            user.role === "teacher" &&
            user.isMain !== true &&
            user.isAdmin === true
    );

}

function canManageAdminAccounts(){

    return Boolean(
        currentUser &&
        (
            currentUser.isMain === true ||
            currentUser.isAdmin === true
        )
    );

}

function groupName(id){

    const group =
        groups.find(
            g => g.id === id
        );

    return group
        ? group.name
        : "Guruh yo‘q";

}

function getTeacherName(id){

    const teacher =
        users.find(
            u => u.id === id
        );

    return teacher
        ? teacher.full_name
        : "-";

}

function escapeHtml(value){

    return String(value ?? "")

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

function toast(message){

    alert(message);

}

async function login(){

    const phone =
        document
        .getElementById("loginPhone")
        .value
        .trim();

    const username =
        document
        .getElementById("loginUsername")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const authenticated =
        await apiRequest("/api/login", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                phone,
                username,
                password
            })
        });

    if(!authenticated || !authenticated.ok){

        const error =
            document.getElementById(
                "loginError"
            );

        error.textContent =
            "Telefon, login yoki parol noto‘g‘ri.";

        error.style.display = "block";

        return;

    }

    currentUser = authenticated.user;

    await loadData();

    const user =
        users.find(
            item => item.id === currentUser.id
        ) || currentUser;

    currentUser = user;

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    currentPage = "dashboard";

    render();

}

================================================== */

function canEditUser(user){

    return Boolean(
        currentUser &&
        (
            currentUser.isMain ||
            currentUser.id === user.id
        )
    );

}

function canResetUserPassword(user){

    return Boolean(
        currentUser &&
        (
            currentUser.isMain ||
            currentUser.id === user.id
        )
    );

}

function canDeleteUser(user){

    return Boolean(
        currentUser &&
        !user.isMain &&
        (
            currentUser.isMain ||
            (
                currentUser.role === "student" &&
                user.role === "student"
            )
        )
    );

}

function editUserCredentials(id){

    const user = users.find(item => item.id === id);

    if(!user || !canEditUser(user)){
        toast("Bu akkauntni o‘zgartirish huquqi yo‘q.");
        return;
    }

    const username = prompt("Yangi login:", user.username);
    if(username === null){
        return;
    }

    const password = prompt("Yangi parol:", user.password);
    if(password === null){
        return;
    }

    const newUsername = username.trim();
    const newPassword = password.trim();

    if(!newUsername || !newPassword){
        toast("Login va parol bo‘sh bo‘lmasin.");
        return;
    }

    if(users.some(item =>
        item.id !== id &&
        String(item.username).toLowerCase() === newUsername.toLowerCase()
    )){
        toast("Bu login band.");
        return;
    }

    user.username = newUsername;
    user.password = newPassword;
    saveData();
    toast("Login va parol yangilandi.");
    render();

}

function resetUserPassword(id){

    const user = users.find(item => item.id === id);

    if(!user || !canResetUserPassword(user)){
        toast("Bu parolni qayta sozlash huquqi yo‘q.");
        return;
    }

    const nextPassword = prompt(
        "Yangi vaqtinchalik parolni kiriting. Bo‘sh qoldirsangiz parol o‘chirib tashlanadi:",
        user.password
    );

    if(nextPassword === null){
        return;
    }

    const cleanPassword = nextPassword.trim();

    user.password = cleanPassword;
    saveData();

    if(cleanPassword.length === 0){
        toast("Parol bekor qilindi.");
    }else{
        toast("Vaqtinchalik parol o‘rnatildi.");
    }

    render();

}

function deleteUser(id){

    const user = users.find(item => item.id === id);

    if(!user || !canDeleteUser(user)){
        toast("Bu akkauntni o‘chirish huquqi yo‘q.");
        return;
    }

    if(!confirm(`${user.full_name} akkauntini o‘chirishni tasdiqlaysizmi?`)){
        return;
    }

    users = users.filter(item => item.id !== id);
    saveData();
    render();

}

function addStudent(){

    if(
        !currentUser ||
        currentUser.role !== "teacher"
    ){

        toast(
            "Faqat o‘qituvchi o‘quvchi qo‘sha oladi."
        );

        return;

    }

    const full_name =
        document
        .getElementById("studentName")
        .value
        .trim();

    const birth =
        document
        .getElementById("studentBirth")
        .value;

    const jshshir =
        document
        .getElementById("studentJshshir")
        .value
        .trim();

    const phone =
        document
        .getElementById("studentPhone")
        .value
        .trim();

    const username =
        document
        .getElementById("studentUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("studentPassword")
        .value;

    const groupId =
        Number(
            document
            .getElementById("studentGroup")
            .value
        ) || null;

    if(
        !full_name ||
        !birth ||
        !jshshir ||
        !phone ||
        !username ||
        !password
    ){

        toast(
            "Barcha maydonlarni to‘ldiring."
        );

        return;
    }

    if(
        !/^\d{14}$/.test(jshshir)
    ){

        toast(
            "JShShIR aynan 14 ta raqam bo‘lishi kerak."
        );

        return;

    }

    if(
        users.some(
            u =>
            String(u.username).toLowerCase()
            === username.toLowerCase()
        )
    ){

        toast(
            "Bu login band."
        );

        return;

    }

    if(
        users.some(
            u => String(u.phone) === phone
        )
    ){

        toast(
            "Bu telefon raqam band."
        );

        return;

    }

    if(
        users.some(
            u => u.jshshir === jshshir
        )
    ){

        toast(
            "Bu JShShIR allaqachon mavjud."
        );

        return;

    }

    const student = {

        id:Date.now(),

        role:"student",

        isMain:false,

        full_name,

        birth,

        jshshir,

        phone,

        username,

        password,

        groupId,

        coins:0

    };

    users.push(student);

    saveData();

    showCredentials(

            .value

            .value
        );

        document

        .value

        !studentId ||
        !subjectId ||
        !value
    ){

        toast(
            "O‘quvchi, fan va bahoni kiriting."
        );

        return;

    if(
        value < 1 ||
        value > 100
    ){

        toast(

        return;

        date:
            new Date()
            .toLocaleDateString("uz-UZ")

    });

    render();

                </div>

                    <button class="primary" onclick="sendAiMessage()">Yuborish</button>
                </div>

        </div>

    `;

    const box = document.getElementById("aiChatBox");

        box.scrollTop = box.scrollHeight;
    }

}

async function sendAiMessage(){

    const input = document.getElementById("aiChatInput");
    const message = input.value.trim();

    if(!message){
        toast("Savolni yozing.");
        return;
    }

    aiChatHistory.push({ role:"user", text:message });
    saveAiChatHistory();

    const assistantMessage = { role:"assistant", text:"Yuborilmoqda..." };
    aiChatHistory.push(assistantMessage);
    saveAiChatHistory();

    renderAiChat();

    const reply = await getAiReply(message);

    aiChatHistory = aiChatHistory.filter(item => item !== assistantMessage);
    aiChatHistory.push({ role:"assistant", text:reply });
    saveAiChatHistory();

    renderAiChat();
    input.value = "";

}

function saveAiApiKey(){

    const input = document.getElementById("aiApiKeyInput");
    const key = input ? input.value.trim() : "";

    if(key){
        localStorage.setItem("coverse_ai_api_key", key);
        toast("API key saqlandi.");
    }else{
        localStorage.removeItem("coverse_ai_api_key");
        toast("API key o‘chirildi. Lokal fallback ishlaydi.");
    }

}

function clearAiChat(){

    aiChatHistory = [];
    saveAiChatHistory();
    renderAiChat();

}

function changeOwnCredentials(){

    if(!currentUser){
        return;
    }

    const username =
        document
        .getElementById("profileUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("profilePassword")
        .value;

    if(!username || !password){
        toast("Login va parolni to‘ldiring.");
        return;
    }

    if(users.some(user =>
        user.id !== currentUser.id &&
        String(user.username).toLowerCase() === username.toLowerCase()
    )){
        toast("Bu login band.");
        return;
    }

    currentUser.username = username;
    currentUser.password = password;
    saveData();
    toast("Login va parol yangilandi.");
    renderStudentProfile();

}

/* ==================================================
   THEME
================================================== */

function updateDeviceMode(){

    const badge =
        document.getElementById("deviceModeBadge");

    if(!badge){
        return;
    }

    const params =
        new URLSearchParams(window.location.search);

    const path =
        window.location.pathname.toLowerCase();

    const requested =
        params.get("device") ||
        (
            path.includes("/app/mobile") || path.includes("/mobile")
            ? "mobile"
            : path.includes("/app/tablet") || path.includes("/tablet")
                ? "tablet"
                : path.includes("/app/desktop") || path.includes("/desktop")
                    ? "desktop"
                    : null
        );

    const mode = requested
        ? requested.charAt(0).toUpperCase() + requested.slice(1)
        : (
            window.innerWidth < 650
            ? "Mobile"
            : window.innerWidth < 900
                ? "Tablet"
                : "Desktop"
        );

    badge.textContent = mode;
}

function toggleTheme(){

    document
        .body
        .classList
        .toggle("light");

    localStorage.setItem(

        THEME_KEY,

        document
        .body
        .classList
        .contains("light")
        ? "light"
        : "dark"

    );

}

/* ==================================================
   FULLSCREEN
================================================== */

function toggleFullscreen(){

    if(
        !document.fullscreenElement
    ){

        document
            .documentElement
            .requestFullscreen()
            .catch(
                ()=>{}
            );

    }else{

        document.exitFullscreen();

    }

}
