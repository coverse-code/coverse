<!DOCTYPE html>

<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yangi link</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #081827, #112844);
      color: #edf3ff;
    }
    .card {
      width: min(700px, 90vw);
      background: rgba(16, 26, 41, 0.82);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 42px 28px;
      box-shadow: 0 28px 60px rgba(0,0,0,0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 4vw, 3rem);
    }
    p {
      margin: 0 0 24px;
      color: #b9c7db;
      line-height: 1.7;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    a {
      display: inline-block;
      text-decoration: none;
      color: white;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, #5f88ff, #7ea1ff);
    }
    .secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Yangi link yaratildi</h1>
    <p>Bu sahifa yangi link uchun tayyor bo‘lib, quyidagi tugmalar orqali davom etish mumkin.</p>
    <div class="actions">
      <a href="converse.html">Appga kirish</a>
      <a class="secondary" href="index.html">Bosh sahifa</a>
    </div>
  </div>
</body>
</html>
